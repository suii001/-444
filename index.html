<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СЕКРЕТАРЬ - 暗号ポータル</title>
  <style>
    :root { --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.85); --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --success: #22c55e; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: #1e293b; color: var(--muted); border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #0f172a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    textarea, input { width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    button.action-btn { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #result-container { margin-top: 20px; background: #000; padding: 10px; border-radius: 6px; word-break: break-all; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>СЕКРЕТАРЬ</h1>
  <div class="tab-buttons">
    <button type="button" class="tab-btn active" id="btn-enc" onclick="switchTab('encrypt')">暗号化</button>
    <button type="button" class="tab-btn" id="btn-dec" onclick="switchTab('decrypt')">解読</button>
  </div>

  <div id="tab-encrypt" class="tab-content active">
    <textarea id="enc-text" placeholder="文章を入力"></textarea>
    <input type="password" id="enc-pass" placeholder="パスワード">
    <button type="button" class="action-btn" id="btn-encrypt-exec">暗号文を生成</button>
  </div>

  <div id="tab-decrypt" class="tab-content">
    <textarea id="dec-cipher" placeholder="СЕКРЕТАРЬ:...を貼り付け"></textarea>
    <input type="password" id="dec-pass" placeholder="パスワード">
    <button type="button" class="action-btn" id="btn-decrypt-exec">解読する</button>
  </div>

  <div id="result-container">
    <div id="result-text"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
