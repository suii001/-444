<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СЕКРЕТАРЬ - 暗号ポータル</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: url("bg.png"); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 4px;
      color: var(--accent);
      letter-spacing: 2px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    textarea, input[type="password"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: monospace;
    }
    textarea { height: 100px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); }
    
    button.action-btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action-btn:hover { background: #7dd3fc; }
    
    .result-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .result-header {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
    }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }
    .attempts-info {
      font-size: 0.75rem;
      color: var(--danger);
      margin-top: 4px;
      text-align: right;
    }

    /* デバッグ用スタイル */
    .debug-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--warning);
      border-radius: 8px;
    }
    .debug-title {
      font-size: 1rem;
      color: var(--warning);
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .debug-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .debug-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }
    .debug-btn:hover { background: #475569; }
    .debug-btn.danger { background: #991b1b; border-color: #ef4444; }
    .debug-btn.danger:hover { background: #dc2626; }
    .console-box {
      background: #000;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 8px;
      height: 120px;
      overflow-y: auto;
      border-radius: 4px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }
    .code-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      padding: 20px;
      justify-content: center;
      align-items: center;
    }
    .code-modal-content {
      background: #0f172a;
      border: 1px solid var(--accent);
      width: 100%;
      max-width: 800px;
      height: 80vh;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .code-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .code-area {
      flex: 1;
      background: #000;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      overflow: auto;
      white-space: pre;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>СЕКРЕТАРЬ</h1>
  <p class="subtitle">高堅牢エンドツーエンド暗号化システム</p>

  <div class="tab-buttons">
    <button class="tab-btn active" type="button" onclick="switchTab('encrypt')">暗号化</button>
    <button class="tab-btn" type="button" onclick="switchTab('decrypt')">解読 (復号)</button>
  </div>

  <div id="tab-encrypt" class="tab-content active">
    <div class="form-group">
      <label for="enc-text">暗号化する文章:</label>
      <textarea id="enc-text" placeholder="ここに秘密の文章を入力..." autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-group">
      <label for="enc-pass">パスワード:</label>
      <input type="password" id="enc-pass" placeholder="パスワードを設定" autocomplete="new-password" oninput="checkStrength(this.value)">
      <div id="strength-meter" style="font-size: 0.75rem; margin-top: 4px; color: var(--muted);"></div>
    </div>
    <button class="action-btn" type="button" onclick="handleEncrypt()">暗号文を生成</button>
  </div>

  <div id="tab-decrypt" class="tab-content">
    <div class="form-group">
      <label for="dec-cipher">暗号テキスト（Base64/Armor形式）:</label>
      <textarea id="dec-cipher" placeholder="СЕКРЕТАРЬ:... を貼り付け" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-group">
      <label for="dec-pass">パスワード:</label>
      <input type="password" id="dec-pass" placeholder="パスワードを入力" autocomplete="current-password">
      <div id="attempts-warn" class="attempts-info"></div>
    </div>
    <button class="action-btn" type="button" onclick="handleDecrypt()">解読する</button>
  </div>

  <div id="result-container" style="display:none;">
    <div class="result-box">
      <div class="result-header">
        <span id="result-label">結果</span>
        <button class="copy-btn" type="button" onclick="copyResult()">ワンタップコピー</button>
      </div>
      <div id="result-text"></div>
    </div>
  </div>
  <div id="status-msg" class="status-msg"></div>

  <div id="debug-panel" class="debug-panel" style="display:none;">
    <div class="debug-title">
      <span>管理者デバッグコンソール</span>
      <button class="copy-btn" type="button" onclick="closeDebug()" style="background:#64748b;">閉じる</button>
    </div>
    <div class="debug-grid">
      <button class="debug-btn" type="button" onclick="runBenchmark()">処理速度計測</button>
      <button class="debug-btn" type="button" onclick="generateDummy()">擬似暗号自動挿入</button>
      <button class="debug-btn" type="button" onclick="showSourceCode()">ソース表示&コピー</button>
      <button class="debug-btn danger" type="button" onclick="resetState()">状態リセット</button>
    </div>
    <label style="font-size:0.75rem;">リアルタイム・システムログ:</label>
    <div id="console-box" class="console-box">[SYSTEM READY] デバッグモード有効化</div>
  </div>
</div>

<div id="code-modal" class="code-modal">
  <div class="code-modal-content">
    <div class="code-modal-header">
      <span style="color:var(--accent); font-weight:bold;">ソースコード (index.html)</span>
      <div>
        <button class="copy-btn" type="button" onclick="copySourceCode()">全コピー</button>
        <button class="copy-btn" type="button" onclick="closeCodeModal()" style="background:#64748b; margin-left:8px;">閉じる</button>
      </div>
    </div>
    <pre id="code-area" class="code-area"></pre>
  </div>
</div>

<script>
  let failedAttempts = 0;
  const MAX_ATTEMPTS = 3;

  const _kData = [0xD0,0xA1,0xD0,0xA3,0xD0,0x98,0xD0,0x98,0x34,0x34,0x34,0xD0,0x9A,0xD1,0x83,0xD0,0xB1,0xD0,0xB0,0x26,0xD0,0x98,0x26,0xD0,0xA5,0xD0,0xBE,0xD1,0x80,0xD0,0xBE];
  function getRootKey() {
    return new TextDecoder().decode(new Uint8Array(_kData));
  }

  function log(msg) {
    const box = document.getElementById('console-box');
    if (!box) return;
    const time = new Date().toLocaleTimeString();
    box.innerText += `\n[${time}] ${msg}`;
    box.scrollTop = box.scrollHeight;
  }

  function wipeArray(arr) {
    if (arr && arr.fill) arr.fill(0);
  }

  function clearInputs() {
    document.getElementById('enc-text').value = '';
    document.getElementById('enc-pass').value = '';
    document.getElementById('dec-pass').value = '';
    document.getElementById('strength-meter').innerText = '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById('result-container').style.display = 'none';
    document.getElementById('status-msg').innerText = '';

    if (tab === 'encrypt') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-encrypt').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-decrypt').classList.add('active');
    }
  }

  function checkStrength(pass) {
    const el = document.getElementById('strength-meter');
    if (!el) return;
    if (!pass) { el.innerText = ''; return; }
    
    let pool = 0;
    if (/[a-z]/.test(pass)) pool += 26;
    if (/[A-Z]/.test(pass)) pool += 26;
    if (/[0-9]/.test(pass)) pool += 10;
    if (/[^a-zA-Z0-9]/.test(pass)) pool += 32;

    const entropy = Math.floor(pass.length * Math.log2(pool || 1));
    if (entropy < 30) {
      el.innerText = `強度: 弱 (エントロピー: ${entropy} bit) - 簡単に解読されます`;
      el.style.color = "var(--danger)";
    } else if (entropy < 60) {
      el.innerText = `強度: 中 (エントロピー: ${entropy} bit) - 標準的な安全性`;
      el.style.color = "var(--warning)";
    } else {
      el.innerText = `強度: 強 (エントロピー: ${entropy} bit) - 非常に堅牢`;
      el.style.color = "var(--success)";
    }
  }

  async function getKey(passwordStr, salt) {
    const enc = new TextEncoder();
    const passBytes = enc.encode(passwordStr);
    const keyMaterial = await crypto.subtle.importKey(
      "raw", passBytes, { name: "PBKDF2" }, false, ["deriveKey"]
    );
    wipeArray(passBytes);

    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function handleEncrypt() {
    const textInput = document.getElementById('enc-text').value;
    const passInput = document.getElementById('enc-pass').value;
    const msgEl = document.getElementById('status-msg');

    if (!textInput || !passInput) {
      msgEl.className = "status-msg error";
      msgEl.innerText = "文章とパスワードを入力してください。";
      return;
    }

    try {
      log("暗号化処理を開始...");
      const enc = new TextEncoder();
      const textBytes = enc.encode(textInput);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const keyUser = await getKey(passInput, salt);
      const encryptedBody = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, keyUser, textBytes);

      const masterSalt = crypto.getRandomValues(new Uint8Array(16));
      const masterIv = crypto.getRandomValues(new Uint8Array(12));
      const rootKeyStr = getRootKey();
      const keyMaster = await getKey(rootKeyStr, masterSalt);
      const encryptedPass = await crypto.subtle.encrypt({ name: "AES-GCM", iv: masterIv }, keyMaster, enc.encode(passInput));

      wipeArray(textBytes);

      const payload = {
        s: Array.from(salt),
        i: Array.from(iv),
        b: Array.from(new Uint8Array(encryptedBody)),
        ms: Array.from(masterSalt),
        mi: Array.from(masterIv),
        mp: Array.from(new Uint8Array(encryptedPass))
      };

      const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));
      let binaryStr = '';
      for (let i = 0; i < jsonBytes.length; i++) {
        binaryStr += String.fromCharCode(jsonBytes[i]);
      }
      const base64Str = btoa(binaryStr);
      const armorFormat = `СЕКРЕТАРЬ:${base64Str}`;

      showResult("暗号化テキスト（Armor形式）", armorFormat);
      msgEl.className = "status-msg success";
      msgEl.innerText = "暗号化成功！コピーして共有してください。";
      log("暗号化完了 Payload Size: " + base64Str.length + " bytes");

      clearInputs();
    } catch (e) {
      log("ERROR: 暗号化失敗 - " + e.message);
      msgEl.className = "status-msg error";
      msgEl.innerText = "暗号化中にエラーが発生しました。";
    }
  }

  async function handleDecrypt() {
    let cipherInput = document.getElementById('dec-cipher').value.trim();
    const passInput = document.getElementById('dec-pass').value;
    const msgEl = document.getElementById('status-msg');
    const warnEl = document.getElementById('attempts-warn');

    if (failedAttempts >= MAX_ATTEMPTS) {
      shredSession();
      return;
    }

    if (!cipherInput && passInput === getRootKey()) {
      document.getElementById('debug-panel').style.display = 'block';
      msgEl.className = "status-msg success";
      msgEl.innerText = "管理者デバッグモードが有効化されました。";
      log("管理者ログイン成功 - デバッグパネルを表示");
      document.getElementById('dec-pass').value = '';
      return;
    }

    if (!cipherInput || !passInput) {
      msgEl.className = "status-msg error";
      msgEl.innerText = "暗号テキストとパスワードを入力してください。";
      return;
    }

    if (cipherInput.startsWith("СЕКРЕТАРЬ:")) {
      cipherInput = cipherInput.replace("СЕКРЕТАРЬ:", "");
    }

    try {
      log("復号処理を開始...");
      const binaryStr = atob(cipherInput);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      const payload = JSON.parse(jsonStr);

      const salt = new Uint8Array(payload.s);
      const iv = new Uint8Array(payload.i);
      const body = new Uint8Array(payload.b);

      let actualPassword = passInput;

      if (passInput === getRootKey()) {
        log("マスターキーによる迂回解読を実行中...");
        const masterSalt = new Uint8Array(payload.ms);
        const masterIv = new Uint8Array(payload.mi);
        const masterPassData = new Uint8Array(payload.mp);

        const keyMaster = await getKey(passInput, masterSalt);
        const decryptedPassBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv: masterIv }, keyMaster, masterPassData);
        actualPassword = new TextDecoder().decode(decryptedPassBytes);
      }

      const keyUser = await getKey(actualPassword, salt);
      const decryptedBody = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyUser, body);

      const plainText = new TextDecoder().decode(decryptedBody);

      showResult("復号されたメッセージ", plainText);
      msgEl.className = "status-msg success";
      msgEl.innerText = "解読に成功しました！";
      log("復号成功: メッセージ出力完了");

      failedAttempts = 0;
      warnEl.innerText = "";
      document.getElementById('dec-pass').value = '';
    } catch (e) {
      failedAttempts++;
      const remain = MAX_ATTEMPTS - failedAttempts;
      log(`ERROR: 復号失敗 (失敗回数: ${failedAttempts}/${MAX_ATTEMPTS})`);

      if (failedAttempts >= MAX_ATTEMPTS) {
        shredSession();
      } else {
        warnEl.innerText = `失敗: あと${remain}回失敗するとロックされます`;
        msgEl.className = "status-msg error";
        msgEl.innerText = "解読失敗: パスワードが間違っているか、データが破損しています。";
      }
    }
  }

  async function runBenchmark() {
    log("ベンチマーク測定を開始 (PBKDF2 100,000 iterations)...");
    const start = performance.now();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    await getKey("BenchmarkTestPass123!", salt);
    const end = performance.now();
    const duration = (end - start).toFixed(2);
    log(`[BENCHMARK] 鍵導出時間: ${duration} ms`);
    alert(`鍵導出速度ベンチマーク結果:\n${duration} ミリ秒`);
  }

  async function generateDummy() {
    log("テスト用サンプル暗号文を生成中...");
    const dummyText = "【システムテストメッセージ】\nこれは自動生成されたテスト暗号データです。";
    const dummyPass = "test1234";

    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const keyUser = await getKey(dummyPass, salt);
    const encryptedBody = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, keyUser, enc.encode(dummyText));

    const masterSalt = crypto.getRandomValues(new Uint8Array(16));
    const masterIv = crypto.getRandomValues(new Uint8Array(12));
    const keyMaster = await getKey(getRootKey(), masterSalt);
    const encryptedPass = await crypto.subtle.encrypt({ name: "AES-GCM", iv: masterIv }, keyMaster, enc.encode(dummyPass));

    const payload = {
      s: Array.from(salt), i: Array.from(iv), b: Array.from(new Uint8Array(encryptedBody)),
      ms: Array.from(masterSalt), mi: Array.from(masterIv), mp: Array.from(new Uint8Array(encryptedPass))
    };

    const jsonBytes = enc.encode(JSON.stringify(payload));
    let binaryStr = '';
    for (let i = 0; i < jsonBytes.length; i++) binaryStr += String.fromCharCode(jsonBytes[i]);
    const armorFormat = `СЕКРЕТАРЬ:${btoa(binaryStr)}`;

    document.getElementById('dec-cipher').value = armorFormat;
    document.getElementById('dec-pass').value = dummyPass;
    log("テストデータを復号フォームに自動セット（Pass: test1234）");
    alert("テスト用暗号文とパスワード (test1234) を復号フォームに入力しました！");
  }

  function showSourceCode() {
    document.getElementById('code-area').innerText = document.documentElement.outerHTML;
    document.getElementById('code-modal').style.display = 'flex';
    log("ソースコードモーダル表示");
  }

  function copySourceCode() {
    const code = document.getElementById('code-area').innerText;
    navigator.clipboard.writeText(code).then(() => {
      alert("ソースコードをクリップボードにコピーしました！");
      log("ソースコードを一括コピーしました");
    });
  }

  function closeCodeModal() {
    document.getElementById('code-modal').style.display = 'none';
  }

  function resetState() {
    failedAttempts = 0;
    document.getElementById('attempts-warn').innerText = '';
    document.getElementById('status-msg').innerText
