<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СЕКРЕТАРЬ - 暗号ポータル</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: url("bg.png"); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 4px;
      color: var(--accent);
      letter-spacing: 2px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    textarea, input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: monospace;
    }
    textarea { height: 100px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); }
    
    button.action-btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action-btn:hover { background: #7dd3fc; }
    
    .result-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .result-header {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
    }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }
    .attempts-info {
      font-size: 0.75rem;
      color: var(--danger);
      margin-top: 4px;
      text-align: right;
    }

    .debug-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--warning);
      border-radius: 8px;
    }
    .debug-title {
      font-size: 1rem;
      color: var(--warning);
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .debug-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .debug-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }
    .debug-btn:hover { background: #475569; }
    .debug-btn.danger { background: #991b1b; border-color: #ef4444; }
    .debug-btn.danger:hover { background: #dc2626; }
    .console-box {
      background: #000;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 8px;
      height: 120px;
      overflow-y: auto;
      border-radius: 4px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }

    .code-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      padding: 20px;
      justify-content: center;
      align-items: center;
    }
    .code-modal-content {
      background: #0f172a;
      border: 1px solid var(--accent);
      width: 100%;
      max-width: 800px;
      height: 80vh;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .code-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .code-area {
      flex: 1;
      background: #000;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      overflow: auto;
      white-space: pre;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>СЕКРЕТАРЬ</h1>
  <p class="subtitle">高堅牢エンドツーエンド暗号化システム</p>

  <div class="tab-buttons">
    <button type="button" class="tab-btn active" id="btn-tab-encrypt" onclick="switchTab('encrypt')">暗号化</button>
    <button type="button" class="tab-btn" id="btn-tab-decrypt" onclick="switchTab('decrypt')">解読 (復号)</button>
  </div>

  <div id="tab-encrypt" class="tab-content active">
    <div class="form-group">
      <label for="enc-text">暗号化する文章:</label>
      <textarea id="enc-text" placeholder="ここに秘密の文章を入力..." autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-group">
      <label for="enc-pass">パスワード:</label>
      <input type="password" id="enc-pass" placeholder="パスワードを設定" autocomplete="off">
    </div>
    <button type="button" class="action-btn" onclick="handleEncrypt()">暗号文を生成</button>
  </div>

  <div id="tab-decrypt" class="tab-content">
    <div class="form-group">
      <label for="dec-cipher">暗号テキスト（Base64/Armor形式）:</label>
      <textarea id="dec-cipher" placeholder="СЕКРЕТАРЬ:... を貼り付け" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-group">
      <label for="dec-pass">パスワード:</label>
      <input type="password" id="dec-pass" placeholder="パスワードを入力" autocomplete="off">
      <div id="attempts-warn" class="attempts-info"></div>
    </div>
    <button type="button" class="action-btn" onclick="handleDecrypt()">解読する</button>
  </div>

  <div id="result-container" style="display:none;">
    <div class="result-box">
      <div class="result-header">
        <span id="result-label">結果</span>
        <button type="button" class="copy-btn" onclick="copyResult()">ワンタップコピー</button>
      </div>
      <div id="result-text"></div>
    </div>
  </div>
  <div id="status-msg" class="status-msg"></div>

  <div id="debug-panel" class="debug-panel" style="display:none;">
    <div class="debug-title">
      <span>管理者デバッグコンソール</span>
      <button type="button" class="copy-btn" onclick="closeDebug()" style="background:#64748b;">閉じる</button>
    </div>
    <div class="debug-grid">
      <button type="button" class="debug-btn" onclick="runBenchmark()">処理速度計測</button>
      <button type="button" class="debug-btn" onclick="generateDummy()">擬似暗号自動挿入</button>
      <button type="button" class="debug-btn" onclick="showSourceCode()">ソース表示&コピー</button>
      <button type="button" class="debug-btn danger" onclick="resetState()">状態リセット</button>
    </div>
    <label style="font-size:0.75rem;">リアルタイム・システムログ:</label>
    <div id="console-box" class="console-box">[SYSTEM READY] デバッグモード有効化</div>
  </div>
</div>

<div id="code-modal" class="code-modal">
  <div class="code-modal-content">
    <div class="code-modal-header">
      <span style="color:var(--accent); font-weight:bold;">ソースコード (index.html)</span>
      <div>
        <button type="button" class="copy-btn" onclick="copySourceCode()">全コピー</button>
        <button type="button" class="copy-btn" onclick="closeCodeModal()" style="background:#64748b; margin-left:8px;">閉じる</button>
      </div>
    </div>
    <pre id="code-area" class="code-area"></pre>
  </div>
</div>
