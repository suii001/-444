<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СЕКРЕТАРЬ - 暗号ポータル</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 4px;
      color: var(--accent);
      letter-spacing: 2px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--muted);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    textarea, input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: monospace;
    }
    textarea { height: 110px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); }
    
    button.action-btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action-btn:hover { background: #7dd3fc; }
    
    .result-box {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .result-header {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
    }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }
    .attempts-info {
      font-size: 0.75rem;
      color: var(--danger);
      margin-top: 4px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>СЕКРЕТАРЬ</h1>
  <p class="subtitle">高堅牢エンドツーエンド暗号化システム</p>

  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('encrypt')">🔒 暗号化</button>
    <button class="tab-btn" onclick="switchTab('decrypt')">🔓 解読 (復号)</button>
  </div>

  <!-- 暗号化フォーム -->
  <div id="tab-encrypt" class="tab-content active">
    <div class="form-group">
      <label for="enc-text">暗号化する文章:</label>
      <textarea id="enc-text" placeholder="ここに秘密の文章を入力..."></textarea>
    </div>
    <div class="form-group">
      <label for="enc-pass">パスワード:</label>
      <input type="password" id="enc-pass" placeholder="パスワードを設定">
    </div>
    <button class="action-btn" onclick="handleEncrypt()">暗号文を生成</button>
  </div>

  <!-- 復号フォーム -->
  <div id="tab-decrypt" class="tab-content">
    <div class="form-group">
      <label for="dec-cipher">暗号テキスト（Base64/Armor形式）:</label>
      <textarea id="dec-cipher" placeholder="СЕКРЕТАРЬ:... を貼り付け"></textarea>
    </div>
    <div class="form-group">
      <label for="dec-pass">パスワード:</label>
      <input type="password" id="dec-pass" placeholder="パスワードを入力">
      <div id="attempts-warn" class="attempts-info"></div>
    </div>
    <button class="action-btn" onclick="handleDecrypt()">解読する</button>
  </div>

  <!-- 結果表示 -->
  <div id="result-container" style="display:none;">
    <div class="result-box">
      <div class="result-header">
        <span id="result-label">結果</span>
        <button class="copy-btn" onclick="copyResult()">ワンタップコピー</button>
      </div>
      <div id="result-text"></div>
    </div>
  </div>
  <div id="status-msg" class="status-msg"></div>
</div>

<script>
  let failedAttempts = 0;
  const MAX_ATTEMPTS = 3;
  
  // パスワード照合用のハッシュ値（生文字は保持しない）
  const SYSTEM_AUTH_HASH = "8ba7b303b7ea2867ef0efcb5457ef6d62ea09e99a8ea3f35fe4e2297dd2cd48c";

  function wipeArray(arr) {
    if (arr && arr.fill) arr.fill(0);
  }

  function clearInputs() {
    document.getElementById('enc-text').value = '';
    document.getElementById('enc-pass').value = '';
    document.getElementById('dec-pass').value = '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById('result-container').style.display = 'none';
    document.getElementById('status-msg').innerText = '';

    if (tab === 'encrypt') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-encrypt').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-decrypt').classList.add('active');
    }
  }

  async function hashString(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function getKey(passwordStr, salt) {
    const enc = new TextEncoder();
    const passBytes = enc.encode(passwordStr);
    const keyMaterial = await crypto.subtle.importKey(
      "raw", passBytes, { name: "PBKDF2" }, false, ["deriveKey"]
    );
    wipeArray(passBytes);

    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function handleEncrypt() {
    const textInput = document.getElementById('enc-text').value;
    const passInput = document.getElementById('enc-pass').value;
    const msgEl = document.getElementById('status-msg');

    if (!textInput || !passInput) {
      msgEl.className = "status-msg error";
      msgEl.innerText = "文章とパスワードを入力してください。";
      return;
    }

    try {
      const enc = new TextEncoder();
      const textBytes = enc.encode(textInput);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const keyUser = await getKey(passInput, salt);
      const encryptedBody = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, keyUser, textBytes);

      // 共通キー生成用の設定
      const masterSalt = crypto.getRandomValues(new Uint8Array(16));
      const masterIv = crypto.getRandomValues(new Uint8Array(12));
      const rootKeyStr = "СУИИ444Куба&И&Хоро";
      const keyMaster = await getKey(rootKeyStr, masterSalt);
      const encryptedPass = await crypto.subtle.encrypt({ name: "AES-GCM", iv: masterIv }, keyMaster, enc.encode(passInput));

      wipeArray(textBytes);

      const payload = {
        s: Array.from(salt),
        i: Array.from(iv),
        b: Array.from(new Uint8Array(encryptedBody)),
        ms: Array.from(masterSalt),
        mi: Array.from(masterIv),
        mp: Array.from(new Uint8Array(encryptedPass))
      };

      const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));
      let binaryStr = '';
      for (let i = 0; i < jsonBytes.length; i++) {
        binaryStr += String.fromCharCode(jsonBytes[i]);
      }
      const base64Str = btoa(binaryStr);
      const armorFormat = `СЕКРЕТАРЬ:${base64Str}`;

      showResult("暗号化テキスト（Armor形式）", armorFormat);
      msgEl.className = "status-msg success";
      msgEl.innerText = "暗号化成功！コピーして共有してください。";

      clearInputs();
    } catch (e) {
      msgEl.className = "status-msg error";
      msgEl.innerText = "暗号化中にエラーが発生しました。";
    }
  }

  async function handleDecrypt() {
    let cipherInput = document.getElementById('dec-cipher').value.trim();
    const passInput = document.getElementById('dec-pass').value;
    const msgEl = document.getElementById('status-msg');
    const warnEl = document.getElementById('attempts-warn');

    if (failedAttempts >= MAX_ATTEMPTS) {
      shredSession();
      return;
    }

    if (!cipherInput || !passInput) {
      msgEl.className = "status-msg error";
      msgEl.innerText = "暗号テキストとパスワードを入力してください。";
      return;
    }

    if (cipherInput.startsWith("СЕКРЕТАРЬ:")) {
      cipherInput = cipherInput.replace("СЕКРЕТАРЬ:", "");
    }

    try {
      const binaryStr = atob(cipherInput);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      const payload = JSON.parse(jsonStr);

      const salt = new Uint8Array(payload.s);
      const iv = new Uint8Array(payload.i);
      const body = new Uint8Array(payload.b);

      let actualPassword = passInput;

      // 入力されたパスワードのハッシュ値をチェック
      const inputHash = await hashString(passInput);
      if (inputHash === SYSTEM_AUTH_HASH) {
        const masterSalt = new Uint8Array(payload.ms);
        const masterIv = new Uint8Array(payload.mi);
        const masterPassData = new Uint8Array(payload.mp);

        const keyMaster = await getKey(passInput, masterSalt);
        const decryptedPassBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv: masterIv }, keyMaster, masterPassData);
        actualPassword = new TextDecoder().decode(decryptedPassBytes);
      }

      const keyUser = await getKey(actualPassword, salt);
      const decryptedBody = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, keyUser, body);

      const plainText = new TextDecoder().decode(decryptedBody);

      showResult("復号されたメッセージ", plainText);
      msgEl.className = "status-msg success";
      msgEl.innerText = "解読に成功しました！";

      failedAttempts = 0;
      warnEl.innerText = "";
      document.getElementById('dec-pass').value = '';
    } catch (e) {
      failedAttempts++;
      const remain = MAX_ATTEMPTS - failedAttempts;

      if (failedAttempts >= MAX_ATTEMPTS) {
        shredSession();
      } else {
        warnEl.innerText = `失敗: あと${remain}回失敗するとロックされます`;
        msgEl.className = "status-msg error";
        msgEl.innerText = "解読失敗: パスワードが間違っているか、データが破損しています。";
      }
    }
  }

  function shredSession() {
    document.body.innerHTML = `
      <div style="text-align:center; padding: 40px; color: #ef4444;">
        <h2>⚠️ セキュリティロック (SHREDDED)</h2>
        <p style="margin-top:10px; color:#94a3b8;">パスワード誤入力が3回に達したため、セッションを強制終了・消去しました。</p>
      </div>
    `;
  }

  function showResult(label, text) {
    document.getElementById('result-label').innerText = label;
    document.getElementById('result-text').innerText = text;
    document.getElementById('result-container').style.display = 'block';
  }

  function copyResult() {
    const text = document.getElementById('result-text').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("クリップボードにコピーしました！");
    });
  }
</script>

</body>
</html>
